# VWL Simulation Configuration
# Modify these values to customize your simulation

# ============================================================================
# ENVIRONMENT CONFIGURATION
# ============================================================================
environment:
  n_firms: 2                    # Number of competing firms
  n_households: 10              # Number of households (consumers + workers)
  max_steps: 50                # Steps per episode

# ============================================================================
# INITIAL VALUE RANGES (at episode start)
# ============================================================================
initial_ranges:
  # Firm starting values
  firms:
    price:
      min: 8.0                  # Minimum initial price
      max: 15.0                 # Maximum initial price
    wage:
      min: 5.0                  # Minimum initial wage
      max: 12.0                 # Maximum initial wage
    max_employees:
      min: 2                    # Minimum capacity
      max: 10                    # Maximum capacity
  
  # Household starting values
  households:
    money:
      min: 80.0                 # Minimum starting capital
      max: 100.0                 # Maximum starting capital

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  iterations: 20                # Total training iterations
  checkpoint_frequency: 10      # Save checkpoint every N iterations
  
  # PPO Hyperparameters
  ppo:
    learning_rate: 0.0003
    gamma: 0.99                 # Discount factor
    lambda: 0.95                # GAE lambda
    clip_param: 0.2             # PPO clip parameter
    train_batch_size: 400
    minibatch_size: 128
    num_epochs: 10
  
  # Parallel workers
  resources:
    num_env_runners: 2          # Parallel workers for sampling
    num_gpus: 0                 # GPUs for training (0 = CPU only)

# ============================================================================
# ECONOMIC PARAMETERS
# ============================================================================
economy:
  # Action Space (defined in env/economy_env.py):
  # - Price/Wage adjustments: -10%, -5%, 0%, +5%, +10% (5 discrete actions)
  # - Firms choose one adjustment level per parameter each step
  
  # Bounds (firms cannot set prices/wages outside these limits)
  price_bounds:
    min: 1.0                    # Minimum allowed price
    max: 50.0                   # Maximum allowed price
  wage_bounds:
    min: 1.0                    # Minimum allowed wage
    max: 20.0                   # Maximum allowed wage
  
  # Household behavior
  consumption_rate: 0.6         # % of money households spend per step
  
  # Reward scaling
  reward_scale: 10.0            # Divide profit by this for reward normalization
