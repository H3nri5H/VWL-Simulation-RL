# VWL Simulation Configuration - Sequential Purchasing Edition
# Version: Rebalanced for realistic competition

# ============================================================================
# ENVIRONMENT CONFIGURATION
# ============================================================================
environment:
  n_firms: 10                    # Number of competing firms
  n_households: 3000             # Number of households (INCREASED for larger market)
  max_steps: 100                 # Steps per episode

# ============================================================================
# INITIAL VALUE RANGES (at episode start)
# ============================================================================
initial_ranges:
  # Firm starting values
  firms:
    price:
      min: 25.0                  # Minimum initial price
      max: 35.0                  # Maximum initial price
    wage:
      min: 15.0                  # Minimum initial wage
      max: 25.0                  # Maximum initial wage
    max_employees:
      min: 80                    # REDUCED from 150 (smaller firms)
      max: 120                   # REDUCED from 250 (prevent monopolies)
    capital:
      min: 5000.0                # Minimum starting capital
      max: 10000.0               # Maximum starting capital
    quality:
      min: 0.65                  # NARROWED from 0.6 (fairer start)
      max: 0.75                  # NARROWED from 0.8 (fairer start)
    marketing:
      min: 0.45                  # NARROWED from 0.4 (fairer start)
      max: 0.55                  # NARROWED from 0.6 (fairer start)
  
  # Household starting values
  households:
    money:
      min: 100.0                 # Minimum starting money
      max: 200.0                 # Maximum starting money
    skill_level:
      min: 0.3                   # Minimum skill (low qualified)
      max: 1.0                   # Maximum skill (highly qualified)
    max_acceptable_price:        # NEW: Price sensitivity per household
      min: 10.0                  # Some HH only buy cheap goods
      max: 100.0                 # Some HH accept premium prices
    wealth_distribution:         # Probability distribution
      low: 0.3                   # 30% low wealth households
      medium: 0.5                # 50% medium wealth households
      high: 0.2                  # 20% high wealth households

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  iterations: 200                # INCREASED from 150 (more training needed)
  checkpoint_frequency: 10       # Save checkpoint every N iterations
  
  # PPO Hyperparameters
  ppo:
    learning_rate: 0.0003
    gamma: 0.99                  # Discount factor
    lambda: 0.95                 # GAE lambda
    clip_param: 0.2              # PPO clip parameter
    train_batch_size: 4000       # Batch size
    minibatch_size: 256          # Minibatch
    num_epochs: 10
    entropy_coef: 0.01           # Encourage exploration
  
  # Parallel workers
  resources:
    num_env_runners: 4           # Parallel workers
    num_gpus: 0                  # GPUs for training (0 = CPU only)

# ============================================================================
# ECONOMIC PARAMETERS - SEQUENTIAL PURCHASING
# ============================================================================
economy:
  # Extended Action Space (5 actions per firm):
  # 1. Price adjustment: -10%, -5%, 0%, +5%, +10% (5 options)
  # 2. Wage adjustment: -10%, -5%, 0%, +5%, +10% (5 options)
  # 3. Marketing level: decrease, keep, increase (3 options)
  # 4. Quality improvement: no, yes (2 options)
  # 5. Capacity change: decrease 1, keep, increase 1 (3 options)
  
  # Bounds (focused action space)
  price_bounds:
    min: 10.0                    # Minimum allowed price
    max: 100.0                   # Maximum allowed price
  wage_bounds:
    min: 10.0                    # Minimum allowed wage
    max: 50.0                    # Maximum allowed wage
  
  # Capacity hard cap (prevent runaway expansion)
  max_employees_hard_cap: 150    # Absolute maximum employees per firm
  
  # Production parameters
  production:
    productivity_per_employee: 6.0      # Base units per employee
    cost_per_unit: 2.0                  # Variable production cost per unit
    fixed_costs: 150.0                  # INCREASED from 100 (scaled for difficulty)
    storage_cost_per_unit: 0.2          # Storage cost per unit
  
  # Investment costs
  investment_costs:
    marketing_per_level: 20.0           # Cost to increase marketing by 0.1
    quality_improvement: 30.0           # Cost to increase quality by 0.05
    capacity_expansion: 50.0            # Cost to add 1 employee slot
  
  # Bankruptcy
  bankruptcy:
    threshold: -2000.0                  # Bankruptcy threshold
    penalty_reward: -50000.0            # MASSIVELY INCREASED from -20 (critical penalty!)
  
  # Household behavior
  households:
    consumption_rate: 0.7               # % of money spent per step
    utility_price_weight: 1.0           # Weight of price in utility
    utility_quality_weight: 0.5         # Weight of quality in utility
    utility_marketing_weight: 0.3       # Weight of marketing in utility
    # Wealth type consumption multipliers
    wealth_multipliers:
      low: 0.8                          # Low wealth: save more
      medium: 1.0                       # Medium wealth: normal
      high: 1.2                         # High wealth: spend more
  
  # Skill impact on productivity
  skill_system:
    base_multiplier: 0.5                # Minimum productivity multiplier
    skill_factor: 0.5                   # Additional multiplier from skills
  
  # Reward parameters (REBALANCED)
  reward:
    scale: 1000.0                       # INCREASED from 100 (profit less influential)
    capital_bonus_divisor: 1000.0       # Capital bonus divisor
    capital_bonus_max: 5.0              # Maximum capital bonus
    market_share_bonus: 10.0            # Market share reward
    inventory_penalty: 2.0              # Excess inventory penalty
    exploration_penalty: 5.0            # Zero revenue penalty
    # NEW: Survivor diversity incentive
    survivor_diversity_threshold: 5     # Penalty if fewer survivors
    survivor_diversity_penalty: 10000   # Penalty per missing survivor

# ============================================================================
# SEQUENTIAL PURCHASING WITH PRICE SENSITIVITY
# ============================================================================
# PURCHASING MECHANISM:
#
# 1. RANDOM HOUSEHOLD ORDER (each step)
#    - Households shuffled randomly every step for fairness
#
# 2. PRICE SENSITIVITY (NEW!)
#    - Each household has max_acceptable_price (10-100)
#    - Firms with price > max_acceptable_price are SKIPPED
#    - Forces price competition at multiple levels
#
# 3. SEQUENTIAL PURCHASING (realistic)
#    - Calculate utility for affordable firms only
#    - Sort firms by utility (best → worst)
#    - Buy from best until budget/inventory exhausted
#    - Continue to next best firm if budget remains
#
# 4. BALANCED MARKET PRESSURE
#    - Smaller firms (80-120 employees vs 150-250)
#    - More households (3000 vs 2000)
#    - Ensures no single firm can serve entire market
#
# EXPECTED OUTCOMES:
# - 7-9 firms survive (realistic competition)
# - Market share: 10-14% per firm (balanced)
# - Price stratification: Some firms compete on price, some on quality
# - Employment: ~70-80% employed by firms
# - Dynamic equilibrium: Firms adjust strategies continuously
#
# REBALANCING CHANGES:
# 1. Bankruptcy penalty: -20 → -50,000 (survival is CRITICAL)
# 2. Profit reward scale: 100 → 1,000 (profit less dominant)
# 3. Max employees: 150-250 → 80-120 (prevent monopolies)
# 4. Households: 2000 → 3000 (larger market)
# 5. Fixed costs: 100 → 150 (higher overhead)
# 6. Quality/Marketing ranges narrowed (fairer initial conditions)
# 7. Survivor diversity penalty (incentivize keeping competitors alive)
# 8. Price sensitivity per household (realistic buyer behavior)
#
# Challenge Rating: ⭐⭐⭐⭐⭐ (Realistic and challenging)
