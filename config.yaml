# VWL Simulation Configuration - Sequential Purchasing Edition

# ============================================================================
# ENVIRONMENT CONFIGURATION
# ============================================================================
environment:
  n_firms: 10                    # Number of competing firms
  n_households: 2000             # Number of households
  max_steps: 100                 # Steps per episode

# ============================================================================
# INITIAL VALUE RANGES (at episode start)
# ============================================================================
initial_ranges:
  # Firm starting values
  firms:
    price:
      min: 25.0                  # Minimum initial price
      max: 35.0                  # Maximum initial price
    wage:
      min: 15.0                  # Minimum initial wage
      max: 25.0                  # Maximum initial wage
    max_employees:
      min: 150                   # Minimum capacity (scaled for 2000 HH)
      max: 250                   # Maximum capacity
    capital:
      min: 5000.0                # Minimum starting capital
      max: 10000.0               # Maximum starting capital
    quality:
      min: 0.6                   # Minimum initial quality
      max: 0.8                   # Maximum initial quality
    marketing:
      min: 0.4                   # Minimum initial marketing level
      max: 0.6                   # Maximum initial marketing level
  
  # Household starting values
  households:
    money:
      min: 100.0                 # Minimum starting money
      max: 200.0                 # Maximum starting money
    skill_level:
      min: 0.3                   # Minimum skill (low qualified)
      max: 1.0                   # Maximum skill (highly qualified)
    wealth_distribution:         # Probability distribution
      low: 0.3                   # 30% low wealth households
      medium: 0.5                # 50% medium wealth households
      high: 0.2                  # 20% high wealth households

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  iterations: 150                # Increased for better convergence
  checkpoint_frequency: 10       # Save checkpoint every N iterations
  
  # PPO Hyperparameters
  ppo:
    learning_rate: 0.0003
    gamma: 0.99                  # Discount factor
    lambda: 0.95                 # GAE lambda
    clip_param: 0.2              # PPO clip parameter
    train_batch_size: 4000       # Batch size
    minibatch_size: 256          # Minibatch
    num_epochs: 10
    entropy_coef: 0.01           # Encourage exploration
  
  # Parallel workers
  resources:
    num_env_runners: 4           # Parallel workers
    num_gpus: 0                  # GPUs for training (0 = CPU only)

# ============================================================================
# ECONOMIC PARAMETERS - SEQUENTIAL PURCHASING
# ============================================================================
economy:
  # Extended Action Space (5 actions per firm):
  # 1. Price adjustment: -10%, -5%, 0%, +5%, +10% (5 options)
  # 2. Wage adjustment: -10%, -5%, 0%, +5%, +10% (5 options)
  # 3. Marketing level: decrease, keep, increase (3 options)
  # 4. Quality improvement: no, yes (2 options)
  # 5. Capacity change: decrease 1, keep, increase 1 (3 options)
  
  # Bounds (focused action space)
  price_bounds:
    min: 10.0                    # Minimum allowed price
    max: 100.0                   # Maximum allowed price
  wage_bounds:
    min: 10.0                    # Minimum allowed wage
    max: 50.0                    # Maximum allowed wage
  
  # Production parameters
  production:
    productivity_per_employee: 6.0      # Base units per employee
    cost_per_unit: 2.0                  # Variable production cost per unit
    fixed_costs: 100.0                  # Fixed costs per step
    storage_cost_per_unit: 0.2          # Storage cost per unit
  
  # Investment costs
  investment_costs:
    marketing_per_level: 20.0           # Cost to increase marketing by 0.1
    quality_improvement: 30.0           # Cost to increase quality by 0.05
    capacity_expansion: 50.0            # Cost to add 1 employee slot
  
  # Bankruptcy
  bankruptcy:
    threshold: -2000.0                  # Bankruptcy threshold
    penalty_reward: -20.0               # Reward penalty for bankruptcy
  
  # Household behavior
  households:
    consumption_rate: 0.7               # % of money spent per step
    utility_price_weight: 1.0           # Weight of price in utility
    utility_quality_weight: 0.5         # Weight of quality in utility
    utility_marketing_weight: 0.3       # Weight of marketing in utility
    # Wealth type consumption multipliers
    wealth_multipliers:
      low: 0.8                          # Low wealth: save more
      medium: 1.0                       # Medium wealth: normal
      high: 1.2                         # High wealth: spend more
  
  # Skill impact on productivity
  skill_system:
    base_multiplier: 0.5                # Minimum productivity multiplier
    skill_factor: 0.5                   # Additional multiplier from skills
  
  # Reward parameters (with reward shaping)
  reward:
    scale: 100.0                        # Profit normalization
    capital_bonus_divisor: 1000.0       # Capital bonus divisor
    capital_bonus_max: 5.0              # Maximum capital bonus
    market_share_bonus: 10.0            # Market share reward
    inventory_penalty: 2.0              # Excess inventory penalty
    exploration_penalty: 5.0            # Zero revenue penalty

# ============================================================================
# SEQUENTIAL PURCHASING MODEL
# ============================================================================
# NEW PURCHASING MECHANISM:
#
# 1. RANDOM HOUSEHOLD ORDER (each step)
#    - Households shuffled randomly every step
#    - Fair competition (not always same HH buys first)
#
# 2. SEQUENTIAL PURCHASING (realistic!)
#    - Calculate utility for all firms
#    - Sort firms by utility (best → worst)
#    - Each household:
#      a) Buy from best firm until money gone OR inventory empty
#      b) If money left, buy from 2nd best firm
#      c) Continue until budget exhausted
#
# 3. NATURAL MARKET PRESSURE
#    - Best firms sell most/all inventory
#    - Medium firms sell some (leftover demand)
#    - Worst firms sell nothing → must improve or die
#
# EXPECTED OUTCOMES:
# - 7-9 firms survive (realistic competition)
# - Market share: 8-15% per firm (balanced)
# - Dynamic market: shares change as firms adjust
# - Natural price discovery (firms learn optimal pricing)
# - Fewer bankruptcies (only truly bad strategies)
#
# ADVANTAGES OVER TOP-3 MODEL:
# - More realistic (people don't split 50/30/20%)
# - Natural market clearing
# - All firms get chance to sell (if competitive)
# - Teaches AI real market dynamics
# - More survivors = better competition
#
# Challenge Rating: ⭐⭐⭐⭐ (Challenging but realistic)
