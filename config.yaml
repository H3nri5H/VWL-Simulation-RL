# VWL Simulation Configuration v5.3.0
# Anti-Monopoly Edition with Top-3 Purchasing

# ============================================================================
# ENVIRONMENT CONFIGURATION
# ============================================================================
environment:
  n_firms: 10                    # Number of competing firms
  n_households: 2000             # Number of households (KEPT HIGH as requested)
  max_steps: 100                 # Steps per episode

# ============================================================================
# INITIAL VALUE RANGES (at episode start)
# ============================================================================
initial_ranges:
  # Firm starting values
  firms:
    price:
      min: 25.0                  # Narrower range for more balanced start
      max: 35.0                  # (was 20-40)
    wage:
      min: 15.0                  # Minimum initial wage
      max: 25.0                  # Narrower range (was 30)
    max_employees:
      min: 150                   # INCREASED for 2000 households!
      max: 250                   # Realistic for large market (was 3-10)
    capital:
      min: 5000.0                # Higher starting capital for larger firms
      max: 10000.0               # (was 1000-1500)
    quality:
      min: 0.6                   # Narrower quality range
      max: 0.8                   # Less extreme differences
    marketing:
      min: 0.4                   # Narrower marketing range
      max: 0.6                   # More balanced competition
  
  # Household starting values
  households:
    money:
      min: 100.0                 # Minimum starting capital
      max: 200.0                 # Maximum starting capital
    skill_level:
      min: 0.3                   # Minimum skill (low qualified)
      max: 1.0                   # Maximum skill (highly qualified)
    wealth_distribution:         # Probability distribution
      low: 0.3                   # 30% low wealth households
      medium: 0.5                # 50% medium wealth households
      high: 0.2                  # 20% high wealth households

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  iterations: 100                # INCREASED for better convergence (was 50)
  checkpoint_frequency: 10       # Save checkpoint every N iterations
  
  # PPO Hyperparameters
  ppo:
    learning_rate: 0.0003
    gamma: 0.99                  # Discount factor
    lambda: 0.95                 # GAE lambda
    clip_param: 0.2              # PPO clip parameter
    train_batch_size: 4000       # Batch size
    minibatch_size: 256          # Minibatch
    num_epochs: 10
    entropy_coef: 0.01           # NEW: Encourage exploration
  
  # Parallel workers
  resources:
    num_env_runners: 4           # Parallel workers
    num_gpus: 0                  # GPUs for training (0 = CPU only)

# ============================================================================
# ECONOMIC PARAMETERS (v5.3.0 - ANTI-MONOPOLY)
# ============================================================================
economy:
  # Extended Action Space (5 actions per firm):
  # 1. Price adjustment: -10%, -5%, 0%, +5%, +10% (5 options)
  # 2. Wage adjustment: -10%, -5%, 0%, +5%, +10% (5 options)
  # 3. Marketing level: decrease, keep, increase (3 options)
  # 4. Quality improvement: no, yes (2 options, costs 30)
  # 5. Capacity change: decrease 1, keep, increase 1 (3 options, increase costs 50)
  
  # NEW: Top-3 Purchasing System (ANTI-MONOPOLY)
  purchasing:
    enable_top3: true            # Enable diversified purchasing
    splits: [0.5, 0.3, 0.2]      # Budget split: 50% best, 30% 2nd, 20% 3rd
  
  # Bounds (TIGHTENED for focused action space)
  price_bounds:
    min: 10.0                    # Minimum allowed price (was 5.0)
    max: 100.0                   # Maximum allowed price (was 10000.0!)
  wage_bounds:
    min: 10.0                    # Minimum allowed wage (was 12.0)
    max: 50.0                    # Maximum allowed wage (was 5000.0!)
  
  # Production parameters
  production:
    productivity_per_employee: 6.0      # Base units per employee
    cost_per_unit: 2.0                  # Variable production cost per unit
    fixed_costs: 100.0                  # INCREASED for larger firms (was 30)
    storage_cost_per_unit: 0.2          # Storage cost per unit
  
  # Investment costs
  investment_costs:
    marketing_per_level: 20.0           # Cost to increase marketing by 0.1
    quality_improvement: 30.0           # Cost to increase quality by 0.05
    capacity_expansion: 50.0            # Cost to add 1 employee slot
  
  # Bankruptcy
  bankruptcy:
    threshold: -2000.0                  # ADJUSTED for larger firms (was -400)
    penalty_reward: -20.0               # Reward penalty (was -200!)
  
  # Household behavior
  households:
    consumption_rate: 0.7               # % of money spent per step
    utility_price_weight: 1.0           # Weight of price in utility calculation
    utility_quality_weight: 0.5         # Weight of quality in utility
    utility_marketing_weight: 0.3       # Weight of marketing in utility
    # Wealth type consumption multipliers
    wealth_multipliers:
      low: 0.8                          # Low wealth: save more (80% of base)
      medium: 1.0                       # Medium wealth: normal (100%)
      high: 1.2                         # High wealth: spend more (120%)
  
  # Skill impact on productivity
  skill_system:
    base_multiplier: 0.5                # Minimum productivity multiplier
    skill_factor: 0.5                   # Additional multiplier from skills
    # Total multiplier = base_multiplier + (avg_skill * skill_factor)
    # Range: 0.5 (all unskilled) to 1.0 (all highly skilled)
  
  # Reward parameters (ENHANCED with reward shaping)
  reward:
    scale: 100.0                        # Divide profit by this for normalization
    capital_bonus_divisor: 1000.0       # Divide capital by this for bonus
    capital_bonus_max: 5.0              # Maximum capital bonus
    # NEW: Reward shaping parameters
    market_share_bonus: 10.0            # Bonus for market share (0-1 → 0-10)
    inventory_penalty: 2.0              # Penalty for excess inventory
    exploration_penalty: 5.0            # Penalty for zero revenue

# ============================================================================
# v5.3.0 CHANGES - ANTI-MONOPOLY EDITION
# ============================================================================
# NEW FEATURES:
# 1. TOP-3 DIVERSIFIED PURCHASING
#    - Households split budget: 50% best, 30% 2nd best, 20% 3rd best firm
#    - Prevents winner-takes-all monopolies
#    - Ensures 3+ firms get market share
#
# 2. ENHANCED REWARD SHAPING
#    - Market share bonus: Reward gaining market share
#    - Inventory penalty: Punish excessive inventory
#    - Exploration penalty: Punish zero revenue (forces action)
#
# 3. BALANCED FOR 2000 HOUSEHOLDS
#    - max_employees: 150-250 (realistic for large market)
#    - Starting capital: 5000-10000 (larger firms)
#    - Fixed costs: 100 (scales with firm size)
#    - Bankruptcy threshold: -2000 (appropriate for larger firms)
#
# 4. TIGHTENED BOUNDS
#    - Price: 10-100 (was 5-10000)
#    - Wage: 10-50 (was 12-5000)
#    - Focused action space for faster learning
#
# 5. TRAINING IMPROVEMENTS
#    - Iterations: 100 (was 50)
#    - Entropy coef: 0.01 (encourage exploration)
#    - Bankruptcy penalty: -20 (was -200, too harsh)
#
# EXPECTED OUTCOMES:
# - 3-5 firms share the market (no monopoly)
# - Dynamic competition and market shifts
# - Realistic employment (~70-80% employed by firms)
# - Profitable operation for competitive firms
# - Bankruptcies only for truly poor strategies
#
# Challenge Rating: ⭐⭐⭐⭐ (Challenging but realistic)
