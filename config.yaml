# VWL Simulation Configuration
# Modify these values to customize your simulation

# ============================================================================
# ENVIRONMENT CONFIGURATION
# ============================================================================
environment:
  n_firms: 10                    # Number of competing firms
  n_households: 50               # Number of households (consumers + workers)
  max_steps: 100                 # Steps per episode

# ============================================================================
# INITIAL VALUE RANGES (at episode start)
# ============================================================================
initial_ranges:
  # Firm starting values
  firms:
    price:
      min: 20.0                  # Minimum initial price
      max: 40.0                  # Maximum initial price
    wage:
      min: 15.0                  # Minimum initial wage
      max: 30.0                  # Maximum initial wage
    max_employees:
      min: 3                     # Minimum capacity
      max: 10                    # Maximum capacity
    capital:
      min: 1000.0                # Minimum starting capital
      max: 1500.0                # Maximum starting capital
    quality:
      min: 0.5                   # Minimum initial quality
      max: 0.8                   # Maximum initial quality
    marketing:
      min: 0.3                   # Minimum initial marketing level
      max: 0.6                   # Maximum initial marketing level
  
  # Household starting values
  households:
    money:
      min: 100.0                 # Minimum starting capital
      max: 200.0                 # Maximum starting capital
    skill_level:
      min: 0.3                   # Minimum skill (low qualified)
      max: 1.0                   # Maximum skill (highly qualified)
    wealth_distribution:         # Probability distribution
      low: 0.3                   # 30% low wealth households
      medium: 0.5                # 50% medium wealth households
      high: 0.2                  # 20% high wealth households

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  iterations: 50                 # Total training iterations
  checkpoint_frequency: 10       # Save checkpoint every N iterations
  
  # PPO Hyperparameters
  ppo:
    learning_rate: 0.0003
    gamma: 0.99                  # Discount factor
    lambda: 0.95                 # GAE lambda
    clip_param: 0.2              # PPO clip parameter
    train_batch_size: 4000       # Increased for better learning
    minibatch_size: 256          # Increased minibatch
    num_epochs: 10
  
  # Parallel workers
  resources:
    num_env_runners: 4           # More workers for diverse experiences
    num_gpus: 0                  # GPUs for training (0 = CPU only)

# ============================================================================
# ECONOMIC PARAMETERS (BALANCED FOR FAIR GAMEPLAY)
# ============================================================================
economy:
  # Extended Action Space (5 actions per firm):
  # 1. Price adjustment: -10%, -5%, 0%, +5%, +10% (5 options)
  # 2. Wage adjustment: -10%, -5%, 0%, +5%, +10% (5 options)
  # 3. Marketing level: decrease, keep, increase (3 options)
  # 4. Quality improvement: no, yes (2 options, costs 30)
  # 5. Capacity change: decrease 1, keep, increase 1 (3 options, increase costs 50)
  
  # Bounds (firms cannot set prices/wages outside these limits)
  price_bounds:
    min: 5.0                     # Minimum allowed price
    max: 100.0                   # Maximum allowed price
  wage_bounds:
    min: 5.0                     # Minimum allowed wage
    max: 50.0                    # Maximum allowed wage
  
  # Production parameters (BALANCED)
  production:
    productivity_per_employee: 6.0      # Base units per employee
    cost_per_unit: 2.0                  # Variable production cost per unit
    fixed_costs: 30.0                   # Fixed costs per step
    storage_cost_per_unit: 0.2          # Storage cost per unit
  
  # Investment costs
  investment_costs:
    marketing_per_level: 20.0           # Cost to increase marketing by 0.1
    quality_improvement: 30.0           # Cost to increase quality by 0.05
    capacity_expansion: 50.0            # Cost to add 1 employee slot
  
  # Bankruptcy
  bankruptcy:
    threshold: -400.0                   # Bankrupt if capital falls below this
    penalty_reward: -20.0               # Reward penalty for bankrupt firms
  
  # Household behavior
  households:
    consumption_rate: 0.7               # % of money spent per step
    utility_price_weight: 1.0           # Weight of price in utility calculation
    utility_quality_weight: 0.5         # Weight of quality in utility
    utility_marketing_weight: 0.3       # Weight of marketing in utility
    # Wealth type consumption multipliers
    wealth_multipliers:
      low: 0.8                          # Low wealth: save more (80% of base)
      medium: 1.0                       # Medium wealth: normal (100%)
      high: 1.2                         # High wealth: spend more (120%)
  
  # Skill impact on productivity
  skill_system:
    base_multiplier: 0.5                # Minimum productivity multiplier
    skill_factor: 0.5                   # Additional multiplier from skills
    # Total multiplier = base_multiplier + (avg_skill * skill_factor)
    # Range: 0.5 (all unskilled) to 1.0 (all highly skilled)
  
  # Reward parameters
  reward:
    scale: 100.0                        # Divide profit by this for normalization
    capital_bonus_divisor: 1000.0       # Divide capital by this for bonus
    capital_bonus_max: 5.0              # Maximum capital bonus

# ============================================================================
# BALANCED GAME MECHANICS - SUMMARY
# ============================================================================
# Firm Mechanics:
# - Starting capital: 1000-1500
# - Bankruptcy threshold: capital < -400
# - Break-even point: ~24% sales rate (achievable)
# - Market supports ~71% sales per firm on average
# - Profitable operation possible with 30%+ sales

# Labor Market:
# - Households have skill levels (0.3 = low, 1.0 = high)
# - Best skilled workers match with highest wage firms first
# - Employee skills affect productivity (0.5-1.0x multiplier)
# - Unemployed get state benefits (avg of min/max wages)

# Goods Market:
# - Utility = (Quality × 0.5 + Marketing × 0.3) / (Price × 1.0)
# - Households buy from firm with highest utility
# - Inventory system: firms can't sell more than they produce

# Investment Costs:
# - Marketing +0.1: 20
# - Quality +0.05: 30
# - Capacity +1 employee: 50

# Bankruptcy:
# - Firms bankrupt if capital < -400
# - Bankrupt firms get penalty reward (-20)
# - Episode ends if all firms bankrupt
# - Surviving firms get capital bonus (+0 to +5)

# Challenge Rating: ⭐⭐⭐ (Challenging but fair)
# - Firms must balance costs and revenue
# - Strategic investments in marketing/quality pay off
# - Poor management leads to bankruptcy after 90+ steps
# - Good management leads to sustained profitability
