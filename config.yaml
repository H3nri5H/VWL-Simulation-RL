# VWL Simulation Configuration - Sequential Purchasing Edition
# Version: Income-based preferences for market diversity

# ============================================================================
# ENVIRONMENT CONFIGURATION
# ============================================================================
environment:
  n_firms: 10                    # Number of competing firms
  n_households: 3000             # Number of households (INCREASED for larger market)
  max_steps: 100                 # Steps per episode

# ============================================================================
# INITIAL VALUE RANGES (at episode start)
# ============================================================================
initial_ranges:
  # Firm starting values
  firms:
    price:
      min: 25.0                  # Minimum initial price
      max: 35.0                  # Maximum initial price
    wage:
      min: 15.0                  # Minimum initial wage
      max: 25.0                  # Maximum initial wage
    max_employees:
      min: 80                    # REDUCED from 150 (smaller firms)
      max: 120                   # REDUCED from 250 (prevent monopolies)
    capital:
      min: 5000.0                # Minimum starting capital
      max: 10000.0               # Maximum starting capital
    quality:
      min: 0.65                  # NARROWED from 0.6 (fairer start)
      max: 0.75                  # NARROWED from 0.8 (fairer start)
    marketing:
      min: 0.45                  # NARROWED from 0.4 (fairer start)
      max: 0.55                  # NARROWED from 0.6 (fairer start)
  
  # Household starting values
  households:
    money:
      min: 100.0                 # Minimum starting money
      max: 200.0                 # Maximum starting money
    skill_level:
      min: 0.3                   # Minimum skill (low qualified)
      max: 1.0                   # Maximum skill (highly qualified)
    max_acceptable_price:        # Price sensitivity per household
      min: 10.0                  # Some HH only buy cheap goods
      max: 100.0                 # Some HH accept premium prices
    wealth_distribution:         # Probability distribution
      low: 0.3                   # 30% low wealth households
      medium: 0.5                # 50% medium wealth households
      high: 0.2                  # 20% high wealth households

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  iterations: 200                # INCREASED from 150 (more training needed)
  checkpoint_frequency: 10       # Save checkpoint every N iterations
  
  # PPO Hyperparameters
  ppo:
    learning_rate: 0.0003
    gamma: 0.99                  # Discount factor
    lambda: 0.95                 # GAE lambda
    clip_param: 0.2              # PPO clip parameter
    train_batch_size: 4000       # Batch size
    minibatch_size: 256          # Minibatch
    num_epochs: 10
    entropy_coef: 0.01           # Encourage exploration
  
  # Parallel workers
  resources:
    num_env_runners: 4           # Parallel workers
    num_gpus: 0                  # GPUs for training (0 = CPU only)

# ============================================================================
# ECONOMIC PARAMETERS - SEQUENTIAL PURCHASING
# ============================================================================
economy:
  # Extended Action Space (5 actions per firm):
  # 1. Price adjustment: -10%, -5%, 0%, +5%, +10% (5 options)
  # 2. Wage adjustment: -10%, -5%, 0%, +5%, +10% (5 options)
  # 3. Marketing level: decrease, keep, increase (3 options)
  # 4. Quality improvement: no, yes (2 options)
  # 5. Capacity change: decrease 1, keep, increase 1 (3 options)
  
  # Bounds (focused action space)
  price_bounds:
    min: 10.0                    # Minimum allowed price
    max: 100.0                   # Maximum allowed price
  wage_bounds:
    min: 10.0                    # Minimum allowed wage
    max: 50.0                    # Maximum allowed wage
  
  # Quality & Marketing bounds (INCREASED - no artificial caps!)
  quality_bounds:
    min: 0.1                     # Minimum quality
    max: 2.0                     # INCREASED from 1.0 (allow premium quality!)
  marketing_bounds:
    min: 0.1                     # Minimum marketing
    max: 2.0                     # INCREASED from 1.0 (allow premium marketing!)
  
  # Capacity hard cap (prevent runaway expansion)
  max_employees_hard_cap: 150    # Absolute maximum employees per firm
  
  # Production parameters
  production:
    productivity_per_employee: 6.0      # Base units per employee
    cost_per_unit: 2.0                  # Base production cost per unit
    quality_cost_factor: 0.5            # NEW! How much quality affects costs (0.0-1.0)
                                        # Formula: cost = base × (1 + quality × factor)
                                        # 0.0 = no quality impact (old behavior)
                                        # 0.5 = moderate (quality 2.0 → 2x costs)
                                        # 1.0 = strong (quality 2.0 → 3x costs)
    fixed_costs: 150.0                  # INCREASED from 100 (scaled for difficulty)
    storage_cost_per_unit: 0.2          # Storage cost per unit
  
  # Investment costs
  investment_costs:
    marketing_per_level: 20.0           # Cost to increase marketing by 0.1
    quality_improvement: 50.0           # INCREASED from 30 (premium quality is expensive!)
    capacity_expansion: 50.0            # Cost to add 1 employee slot
  
  # Bankruptcy
  bankruptcy:
    threshold: -2000.0                  # Bankruptcy threshold
    penalty_reward: -50000.0            # MASSIVELY INCREASED from -20 (critical penalty!)
  
  # Household behavior (BASE weights - modified by wealth type!)
  households:
    consumption_rate: 0.7               # % of money spent per step
    
    # BASE utility weights (modified per wealth type below)
    utility_quality_weight: 0.5         # Base weight of quality in utility
    utility_marketing_weight: 0.3       # Base weight of marketing in utility
    utility_price_weight: 1.0           # Base weight of price in utility
    
    # WEALTH-BASED UTILITY MODIFIERS (NEW!)
    # These multiply the base weights based on household wealth type
    wealth_utility_modifiers:
      low:
        price_weight: 1.5               # Low-wealth: VERY price sensitive (1.0 × 1.5 = 1.5)
        quality_weight: 0.6             # Low-wealth: Less care about quality (0.5 × 0.6 = 0.3)
        marketing_weight: 0.7           # Low-wealth: Less influenced by ads (0.3 × 0.7 = 0.21)
      medium:
        price_weight: 1.0               # Medium-wealth: Normal (1.0 × 1.0 = 1.0)
        quality_weight: 1.0             # Medium-wealth: Normal (0.5 × 1.0 = 0.5)
        marketing_weight: 1.0           # Medium-wealth: Normal (0.3 × 1.0 = 0.3)
      high:
        price_weight: 0.5               # High-wealth: Less price sensitive! (1.0 × 0.5 = 0.5)
        quality_weight: 1.8             # High-wealth: VERY quality focused (0.5 × 1.8 = 0.9)
        marketing_weight: 1.5           # High-wealth: More influenced by branding (0.3 × 1.5 = 0.45)
    
    # Wealth type consumption multipliers
    wealth_multipliers:
      low: 0.8                          # Low wealth: save more
      medium: 1.0                       # Medium wealth: normal
      high: 1.2                         # High wealth: spend more
  
  # Skill impact on productivity
  skill_system:
    base_multiplier: 0.5                # Minimum productivity multiplier
    skill_factor: 0.5                   # Additional multiplier from skills
  
  # Reward parameters (REBALANCED)
  reward:
    scale: 1000.0                       # INCREASED from 100 (profit less influential)
    capital_bonus_divisor: 1000.0       # Capital bonus divisor
    capital_bonus_max: 5.0              # Maximum capital bonus
    market_share_bonus: 10.0            # Market share reward
    inventory_penalty: 2.0              # Excess inventory penalty
    exploration_penalty: 5.0            # Zero revenue penalty
    # NEW: Survivor diversity incentive
    survivor_diversity_threshold: 5     # Penalty if fewer survivors
    survivor_diversity_penalty: 10000   # Penalty per missing survivor

# ============================================================================
# QUALITY-BASED PRODUCTION COSTS EXPLANATION
# ============================================================================
# COST FORMULA:
#   production_costs = production × cost_per_unit × (1 + quality × quality_cost_factor)
#
# EXAMPLES (with cost_per_unit=2.0, quality_cost_factor=0.5):
#
# Quality 0.1:  cost = 2.0 × (1 + 0.1 × 0.5) = 2.0 × 1.05  = 2.10€/unit
# Quality 0.5:  cost = 2.0 × (1 + 0.5 × 0.5) = 2.0 × 1.25  = 2.50€/unit
# Quality 1.0:  cost = 2.0 × (1 + 1.0 × 0.5) = 2.0 × 1.5   = 3.00€/unit
# Quality 1.5:  cost = 2.0 × (1 + 1.5 × 0.5) = 2.0 × 1.75  = 3.50€/unit
# Quality 2.0:  cost = 2.0 × (1 + 2.0 × 0.5) = 2.0 × 2.0   = 4.00€/unit
#
# BUDGET FIRM STRATEGY (quality 0.5-0.8):
#   - Production costs: 2.50-2.80€/unit
#   - Can sell at 15-30€ profitably
#   - Targets low-wealth households (30% market)
#
# MAINSTREAM FIRM STRATEGY (quality 1.0-1.3):
#   - Production costs: 3.00-3.30€/unit
#   - Needs to sell at 30-60€
#   - Targets medium-wealth households (50% market)
#
# PREMIUM FIRM STRATEGY (quality 1.5-2.0):
#   - Production costs: 3.50-4.00€/unit
#   - Must sell at 60-100€
#   - Targets high-wealth households (20% market)
#
# TUNING GUIDE:
#   - quality_cost_factor = 0.0 → No quality impact (convergence problem!)
#   - quality_cost_factor = 0.3 → Weak impact (still risky)
#   - quality_cost_factor = 0.5 → Moderate impact (RECOMMENDED)
#   - quality_cost_factor = 0.8 → Strong impact (harsh for premium)
#   - quality_cost_factor = 1.0 → Very strong (premium very expensive)
#
# RESULT:
#   - Natural market segmentation
#   - Multiple profitable strategies
#   - NO convergence to max quality!
#   - Realistic economic trade-offs ✅
#
# ============================================================================
# INCOME-BASED UTILITY PREFERENCES
# ============================================================================
# UTILITY CALCULATION (per wealth type):
#
# LOW-WEALTH HOUSEHOLDS (30% - Budget Segment):
#   Utility = (quality × 0.3 + marketing × 0.21) / (price × 1.5)
#   → Very price sensitive! Cheap products win
#   → Will buy from 15-35€ firms with decent quality
#
# MEDIUM-WEALTH HOUSEHOLDS (50% - Mainstream):
#   Utility = (quality × 0.5 + marketing × 0.3) / (price × 1.0)
#   → Balanced: Good value for money
#   → Will buy from 25-60€ firms with good quality/marketing mix
#
# HIGH-WEALTH HOUSEHOLDS (20% - Premium Segment):
#   Utility = (quality × 0.9 + marketing × 0.45) / (price × 0.5)
#   → Quality & brand focused! Price less important
#   → Will buy from 50-100€ firms with high quality
#
# EXAMPLE:
# Budget Firm: Price=20€, Quality=0.7, Marketing=0.5
#   Low-wealth utility:  (0.7×0.3 + 0.5×0.21) / (20×1.5) = 0.0105  ← HIGH
#   High-wealth utility: (0.7×0.9 + 0.5×0.45) / (20×0.5) = 0.0855  ← VERY HIGH
#
# Premium Firm: Price=70€, Quality=1.8, Marketing=1.5
#   Low-wealth utility:  (1.8×0.3 + 1.5×0.21) / (70×1.5) = 0.0081  ← LOW
#   High-wealth utility: (1.8×0.9 + 1.5×0.45) / (70×0.5) = 0.0656  ← HIGH
#
# NATURAL MARKET SEGMENTATION:
# - Budget firms (15-35€): Target low & medium wealth (80% of market)
# - Premium firms (50-100€): Target high wealth (20% of market)
# - Both strategies can be profitable!
# - No "race to the bottom" - quality matters for rich customers!
#
# EXPECTED OUTCOMES:
# - 3-4 budget firms (low price, medium quality)
# - 3-4 mainstream firms (medium price, good quality)
# - 2-3 premium firms (high price, high quality)
# - ALL profitable in their segments! ✅
#
# Challenge Rating: ⭐⭐⭐⭐⭐ (Realistic market dynamics)
